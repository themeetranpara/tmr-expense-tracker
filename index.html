// ===================== TMR Expense Tracker =====================
// Personal finance operating system. Local-only, LocalStorage persisted.
// No auth / accounts / payments — single-user personal tool.

type ID = string;

interface Expense { id: ID; amount: number; category: string; description: string; date: string; }
interface Income { id: ID; amount: number; category: string; description: string; date: string; }
interface ForexTrade {
  id: ID; pair: string; direction: 'Buy' | 'Sell'; entryPrice: number; exitPrice: number | null;
  lotSize: number; status: 'Open' | 'Closed'; date: string; notes: string;
}
interface CryptoHolding { id: ID; coin: string; symbol: string; quantity: number; avgBuyPrice: number; currentPrice: number; date: string; }
type BusinessType = 'dropshipping' | 'dropservicing' | 'mediaAgency' | 'interestIncome';
interface BusinessEntry { id: ID; type: BusinessType; description: string; revenue: number; expense: number; date: string; }
interface Meeting { id: ID; title: string; date: string; time: string; notes: string; reminder: boolean; completed: boolean; }
interface Note { id: ID; title: string; content: string; pinned: boolean; date: string; tags: string[]; }
interface Goal { id: ID; title: string; category: string; targetAmount: number; currentAmount: number; deadline: string; notes: string; }

const { useState, useEffect, useRef, useMemo, useCallback } = React;

// ---------------------- constants ----------------------
const EXPENSE_CATEGORIES = ['Food & Dining','Transport','Housing','Utilities','Entertainment','Health & Fitness','Shopping','Education','Business','Given to Someone','Other'];
const INCOME_CATEGORIES = ['Salary','Freelance','Business','Investment','Gifts','Other'];
const GOAL_CATEGORIES = ['Savings','Travel','Emergency Fund','Investment','Purchase','Other'];
const BUSINESS_TYPES: { key: BusinessType; label: string; color: string }[] = [
  { key: 'dropshipping', label: 'Dropshipping', color: '#34D399' },

];
const CHART_PALETTE = ['#34D399','#818CF8','#F59E0B','#F472B6','#38BDF8','#A78BFA','#FB7185','#4ADE80','#FACC15','#22D3EE'];

const MODULES = [

// ---------------------- utils ----------------------
function uid(): ID { return Date.now().toString(36) + Math.random().toString(36).slice(2, 9); }
function todayISO(): string { return new Date().toISOString().slice(0, 10); }
const inr = new Intl.NumberFormat('en-IN', { style: 'currency', currency: 'INR', maximumFractionDigits: 0 });
function formatINR(n: number): string { return inr.format(Number.isFinite(n) ? n : 0); }
function formatNum(n: number, digits = 2): string { return Number.isFinite(n) ? n.toLocaleString('en-IN', { maximumFractionDigits: digits, minimumFractionDigits: 0 }) : '0'; }
function formatDate(d: string): string {
  if (!d) return '';
  const dt = new Date(d + 'T00:00:00');
  if (isNaN(dt.getTime())) return d;
  return dt.toLocaleDateString('en-IN', { day: '2-digit', month: 'short', year: 'numeric' });
}
function monthKey(d: string): string { return (d || '').slice(0, 7); }
function monthLabel(key: string): string {
  const [y, m] = key.split('-').map(Number);
  if (!y || !m) return key;
  return new Date(y, m - 1, 1).toLocaleDateString('en-IN', { month: 'short', year: '2-digit' });
}
function lastNMonthKeys(n: number): string[] {
  const out: string[] = [];
  const now = new Date();
  for (let i = n - 1; i >= 0; i--) {
    const d = new Date(now.getFullYear(), now.getMonth() - i, 1);
    out.push(`${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`);
  }
  return out;
}

// ---------------------- date-range filter helpers (Expenses filter) ----------------------
type DateFilterMode = 'today' | 'week' | 'month' | 'year' | 'all' | 'custom';
interface DateFilterState { mode: DateFilterMode; start: string; end: string; }

function dateToISO(d: Date): string {
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
}
// Monday-start week containing `d`.
function weekRange(d: Date): { start: string; end: string } {
  const day = d.getDay(); // 0 = Sunday ... 6 = Saturday
  const diffToMonday = day === 0 ? -6 : 1 - day;
  const monday = new Date(d.getFullYear(), d.getMonth(), d.getDate() + diffToMonday);
  const sunday = new Date(monday.getFullYear(), monday.getMonth(), monday.getDate() + 6);
  return { start: dateToISO(monday), end: dateToISO(sunday) };
}
// Resolve a filter state into an inclusive [start, end] ISO range, or null bounds for "all time".
function resolveDateRange(filter: DateFilterState): { start: string | null; end: string | null } {
  const now = new Date();
  switch (filter.mode) {
    case 'today': { const t = todayISO(); return { start: t, end: t }; }
    case 'week': return weekRange(now);
    case 'month': { const y = now.getFullYear(), m = now.getMonth(); return { start: dateToISO(new Date(y, m, 1)), end: dateToISO(new Date(y, m + 1, 0)) }; }
    case 'year': { const y = now.getFullYear(); return { start: `${y}-01-01`, end: `${y}-12-31` }; }
    case 'custom': return { start: filter.start || null, end: filter.end || null };
    case 'all':
    default:
      return { start: null, end: null };
  }
}
function dateFilterLabel(filter: DateFilterState): string {
  switch (filter.mode) {
    case 'today': return 'Today';
    case 'week': return 'This Week';
    case 'month': return 'This Month';
    case 'year': return 'This Year';
    case 'custom': return filter.start && filter.end ? `${formatDate(filter.start)} – ${formatDate(filter.end)}` : 'Custom Range';
    case 'all':
    default:
      return 'Total Expenses';
  }
}
const DAY_OPTIONS = Array.from({ length: 31 }, (_, i) => i + 1);
const MONTH_OPTIONS = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
const YEAR_OPTIONS = (() => { const y = new Date().getFullYear(); const out: number[] = []; for (let i = y - 6; i <= y + 1; i++) out.push(i); return out; })();
function partsFromISO(iso: string): { day: number; month: number; year: number } {
  if (iso) { const [y, m, d] = iso.split('-').map(Number); if (y && m && d) return { day: d, month: m - 1, year: y }; }
  const t = new Date();
  return { day: t.getDate(), month: t.getMonth(), year: t.getFullYear() };
}
function partsToISO(day: number, month: number, year: number): string {
  const lastDay = new Date(year, month + 1, 0).getDate();
  const safeDay = Math.min(day, lastDay);
  return `${year}-${String(month + 1).padStart(2, '0')}-${String(safeDay).padStart(2, '0')}`;
}

// ---------------------- localStorage hook ----------------------
function useLocalStorageState<T>(key: string, initial: T): [T, React.Dispatch<React.SetStateAction<T>>] {
  const storageKey = 'tmr-expense-tracker:' + key;
  const [state, setState] = useState<T>(() => {
    try {
      const raw = window.localStorage.getItem(storageKey);
      return raw ? JSON.parse(raw) as T : initial;
    } catch (e) { return initial; }
  });
  useEffect(() => {
    try { window.localStorage.setItem(storageKey, JSON.stringify(state)); } catch (e) {}
  }, [state]);
  return [state, setState];
}

function Button({ children, onClick, variant = 'primary', className = '', type = 'button', accent }: any) {
  const base = 'inline-flex items-center gap-2 px-4 py-2.5 rounded-xl text-sm font-semibold transition-all duration-200 focus-ring active:scale-[0.97]';

  return (
    <button type={type} onClick={onClick} className={`${base} ${styles[variant]} ${className}`}
      style={variant === 'primary' ? { backgroundImage: bg } : {}}>

function ChartCanvas({ config, height = 260 }: { config: any; height?: number }) {
  const canvasRef = useRef<HTMLCanvasElement>(null);
  const chartRef = useRef<any>(null);
  const sig = useMemo(() => JSON.stringify(config, (k, v) => typeof v === 'function' ? undefined : v), [config]);
  useEffect(() => {
    if (!canvasRef.current) return;
    if (chartRef.current) chartRef.current.destroy();
    // @ts-ignore
    chartRef.current = new window.Chart(canvasRef.current.getContext('2d'), config);
    return () => { if (chartRef.current) chartRef.current.destroy(); };
  }, [sig]);
  return <div style={{ height }}><canvas ref={canvasRef}></canvas></div>;
}

let CURRENT_THEME: 'dark' | 'light' = 'dark';

    responsive: true,
    maintainAspectRatio: false,
    plugins: {
      legend: { labels: { color: legend, font: { family: 'Inter', size: 11 }, usePointStyle: true, boxWidth: 8 } },
      tooltip: {
        backgroundColor: isLight ? '#FFFFFF' : '#1A1C22',
        borderColor: isLight ? 'rgba(15,23,32,0.12)' : 'rgba(255,255,255,0.1)',

}

// DASHBOARD
// ============================================================
function DashboardView({ data }: { data: any }) {
  const { expenses, incomes, forexTrades, cryptoHoldings, business, goals, meetings } = data;

  const totalIncome = useMemo(() => incomes.reduce((s: number, i: Income) => s + i.amount, 0), [incomes]);
  const totalExpense = useMemo(() => expenses.reduce((s: number, e: Expense) => s + e.amount, 0), [expenses]);
  const netSavings = totalIncome - totalExpense;

  const forexPnl = useMemo(() => forexTrades.filter((t: ForexTrade) => t.status === 'Closed' && t.exitPrice != null)
    .reduce((s: number, t: ForexTrade) => s + tradePnl(t), 0), [forexTrades]);

  const cryptoPnl = useMemo(() => cryptoHoldings.reduce((s: number, h: CryptoHolding) => s + (h.currentPrice - h.avgBuyPrice) * h.quantity, 0), [cryptoHoldings]);
  const cryptoValue = useMemo(() => cryptoHoldings.reduce((s: number, h: CryptoHolding) => s + h.currentPrice * h.quantity, 0), [cryptoHoldings]);

  const businessProfit = useMemo(() => business.reduce((s: number, b: BusinessEntry) => s + (b.revenue - b.expense), 0), [business]);

  const netPosition = netSavings + forexPnl + cryptoPnl + businessProfit;

  const months = lastNMonthKeys(6);
  const incomeByMonth = months.map(m => incomes.filter((i: Income) => monthKey(i.date) === m).reduce((s: number, i: Income) => s + i.amount, 0));
  const expenseByMonth = months.map(m => expenses.filter((e: Expense) => monthKey(e.date) === m).reduce((s: number, e: Expense) => s + e.amount, 0));

  const categoryTotals: Record<string, number> = {};
  expenses.forEach((e: Expense) => { categoryTotals[e.category] = (categoryTotals[e.category] || 0) + e.amount; });
  const catLabels = Object.keys(categoryTotals);
  const catValues = catLabels.map(l => categoryTotals[l]);

  const recent = useMemo(() => {
    const items = [
      ...incomes.map((i: Income) => ({ ...i, kind: 'Income' })),
      ...expenses.map((e: Expense) => ({ ...e, kind: 'Expense' })),
    ].sort((a, b) => (b.date > a.date ? 1 : -1)).slice(0, 6);
    return items;
  }, [incomes, expenses]);

  const upcomingMeetings = useMemo(() => meetings.filter((m: Meeting) => !m.completed && m.date >= todayISO())
    .sort((a: Meeting, b: Meeting) => (a.date + a.time).localeCompare(b.date + b.time)).slice(0, 4), [meetings]);

  const barConfig = {
    type: 'bar',
    data: {
      labels: months.map(monthLabel),
      datasets: [
        { label: 'Income', data: incomeByMonth, backgroundColor: '#34D399', borderRadius: 6, maxBarThickness: 22 },
        { label: 'Expense', data: expenseByMonth, backgroundColor: '#FB7185', borderRadius: 6, maxBarThickness: 22 },
      ],
    },
    options: baseChartOptions(),
  };

  const doughnutConfig = {
    type: 'doughnut',
    data: { labels: catLabels, datasets: [{ data: catValues, backgroundColor: CHART_PALETTE, borderWidth: 0 }] },
    options: { ...baseChartOptions(), cutout: '68%', scales: undefined },
  };

  return (
    <div className="view-enter space-y-6">
      <div className="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-4 gap-4">
        <StatCard label="Net Position" value={formatINR(netPosition)} icon="target" accent="#34D399" sub="Income − expenses + trading + crypto + business" />
        <StatCard label="Total Income" value={formatINR(totalIncome)} icon="trendingUp" accent="#34D399" sub={`${incomes.length} entries`} />
        <StatCard label="Total Expenses" value={formatINR(totalExpense)} icon="wallet" accent="#FB7185" sub={`${expenses.length} entries`} />
        <StatCard label="Business Profit" value={formatINR(businessProfit)} icon="briefcase" accent="#D4AF37" sub={`${business.length} entries`} />
        <StatCard label="Forex P&L" value={formatINR(forexPnl)} icon="activity" accent="#818CF8" sub={`${forexTrades.length} trades`} />
        <StatCard label="Crypto P&L" value={formatINR(cryptoPnl)} icon="coin" accent="#F59E0B" sub={`Value ${formatINR(cryptoValue)}`} />
        <StatCard label="Active Goals" value={String(goals.filter((g: Goal) => g.currentAmount < g.targetAmount).length)} icon="target" accent="#F472B6" sub={`${goals.length} total`} />
        <StatCard label="Upcoming Meetings" value={String(upcomingMeetings.length)} icon="calendar" accent="#38BDF8" sub="Next 4 shown below" />
      </div>

      <div className="grid grid-cols-1 xl:grid-cols-3 gap-6">
        <Card className="xl:col-span-2">
          <div className="flex items-center justify-between mb-4">
            <h3 className="font-display font-semibold">Income vs Expenses</h3>
            <span className="text-xs text-white/40">Last 6 months</span>
          </div>
          <ChartCanvas config={barConfig} />
        </Card>
        <Card>
          <h3 className="font-display font-semibold mb-4">Expense Categories</h3>
          {catLabels.length ? <ChartCanvas config={doughnutConfig} height={220} /> : <EmptyState icon="wallet" title="No expenses yet" sub="Add expenses to see category breakdown" />}
        </Card>
      </div>

      <div className="grid grid-cols-1 xl:grid-cols-3 gap-6">
        <Card className="xl:col-span-2">
          <h3 className="font-display font-semibold mb-4">Recent Transactions</h3>
          {recent.length === 0 ? <EmptyState icon="wallet" title="No transactions yet" sub="Add income or expenses to get started" /> : (
            <div className="space-y-1">
              {recent.map((r: any) => (
                <div key={r.kind + r.id} className="flex items-center justify-between py-2.5 border-b border-white/5 last:border-0">
                  <div className="flex items-center gap-3">
                    <div className="w-8 h-8 rounded-lg flex items-center justify-center" style={{ background: (r.kind === 'Income' ? '#34D399' : '#FB7185') + '22', color: r.kind === 'Income' ? '#34D399' : '#FB7185' }}>
                      <Icon name={r.kind === 'Income' ? 'arrowUp' : 'arrowDown'} size={14} />

                    <div>
                      <div className="text-sm font-medium">{r.description || r.category}</div>
                      <div className="text-xs text-white/40">{r.category} · {formatDate(r.date)}</div>
                    </div>

                  <span className={`text-sm font-semibold tabular-nums ${r.kind === 'Income' ? 'text-emerald-400' : 'text-rose-400'}`}>

                </div>
              ))}
            </div>
          )}
        </Card>
        <Card>
          <h3 className="font-display font-semibold mb-4">Upcoming</h3>
          {upcomingMeetings.length === 0 ? <EmptyState icon="calendar" title="Nothing scheduled" sub="Add meetings in the Scheduler" /> : (
            <div className="space-y-3">
              {upcomingMeetings.map((m: Meeting) => (
                <div key={m.id} className="flex items-start gap-3">
                  <div className="w-9 h-9 rounded-lg bg-sky-400/10 text-sky-400 flex flex-col items-center justify-center text-[10px] font-bold leading-none shrink-0">
                    <span>{new Date(m.date + 'T00:00:00').getDate()}</span>
                  </div>
                  <div className="min-w-0">
                    <div className="text-sm font-medium truncate">{m.title}</div>
                    <div className="text-xs text-white/40">{formatDate(m.date)} · {m.time}</div>
                  </div>
                </div>
              ))}
            </div>
          )}
        </Card>
      </div>
    </div>
  );
}

function tradePnl(t: ForexTrade): number {
  if (t.exitPrice == null) return 0;
  const dir = t.direction === 'Buy' ? 1 : -1;
  return (t.exitPrice - t.entryPrice) * t.lotSize * dir;
}

// ============================================================
// EXPENSE DATE FILTER — Today / This Week / This Month / This Year /
// Total Expenses / Custom Range. Used only by the Expenses view.
// ============================================================
function ExpenseDateFilter({ filter, setFilter, accent }: { filter: DateFilterState; setFilter: (f: DateFilterState) => void; accent: string }) {
  const [open, setOpen] = useState(false);
  const [customOpen, setCustomOpen] = useState(false);
  const startParts0 = partsFromISO(filter.start);
  const endParts0 = partsFromISO(filter.end);
  const [startDay, setStartDay] = useState(startParts0.day);
  const [startMonth, setStartMonth] = useState(startParts0.month);
  const [startYear, setStartYear] = useState(startParts0.year);
  const [endDay, setEndDay] = useState(endParts0.day);
  const [endMonth, setEndMonth] = useState(endParts0.month);
  const [endYear, setEndYear] = useState(endParts0.year);

  const OPTIONS: { mode: DateFilterMode; label: string }[] = [
    { mode: 'today', label: 'Today' },
    { mode: 'week', label: 'This Week' },
    { mode: 'month', label: 'This Month' },
    { mode: 'year', label: 'This Year' },
    { mode: 'all', label: 'Total Expenses (All Time)' },
  ];

  function choose(mode: DateFilterMode) {
    if (mode === 'custom') return;
    setFilter({ mode, start: '', end: '' });
    setOpen(false);
  }
  function openCustom() {
    const s = partsFromISO(filter.start || todayISO());
    const e = partsFromISO(filter.end || todayISO());
    setStartDay(s.day); setStartMonth(s.month); setStartYear(s.year);
    setEndDay(e.day); setEndMonth(e.month); setEndYear(e.year);
    setOpen(false);
    setCustomOpen(true);
  }
  function applyCustom() {
    const start = partsToISO(startDay, startMonth, startYear);
    const end = partsToISO(endDay, endMonth, endYear);
    const [s, e] = start <= end ? [start, end] : [end, start];
    setFilter({ mode: 'custom', start: s, end: e });
    setCustomOpen(false);
  }
  function resetCustom() {
    const t = partsFromISO(todayISO());
    setStartDay(t.day); setStartMonth(t.month); setStartYear(t.year);
    setEndDay(t.day); setEndMonth(t.month); setEndYear(t.year);
  }

  const selectCls = 'bg-white/5 border border-white/10 rounded-lg px-2 py-2 text-sm text-white focus:bg-white/[0.07] transition-colors w-full';

  return (
    <div className="relative">
      <button type="button" onClick={() => setOpen(o => !o)}
        className="inline-flex items-center gap-2 px-3.5 py-2.5 rounded-xl text-sm font-medium bg-white/5 hover:bg-white/10 border border-white/10 text-white/80 transition-colors focus-ring">
        <Icon name="calendar" size={14} className="text-white/40" />
        {dateFilterLabel(filter)}
        <Icon name="chevronRight" size={12} className={`text-white/30 transition-transform ${open ? 'rotate-90' : ''}`} />
      </button>

      {open ? (
        <>
          <div className="fixed inset-0 z-40" onClick={() => setOpen(false)}></div>
          <div className="absolute right-0 mt-2 w-64 max-w-[calc(100vw-2rem)] glass-strong rounded-2xl p-1.5 z-50 modal-pop origin-top-right shadow-2xl">
            {OPTIONS.map(o => (
              <button key={o.mode} onClick={() => choose(o.mode)}
                className={`w-full text-left px-3.5 py-2.5 rounded-xl text-sm flex items-center justify-between transition-colors ${filter.mode === o.mode ? 'bg-white/10 text-white' : 'text-white/70 hover:bg-white/5 hover:text-white'}`}>
                {o.label}
                {filter.mode === o.mode ? <Icon name="check" size={14} style={{ color: accent }} /> : null}
              </button>
            ))}
            <div className="h-px bg-white/10 my-1.5"></div>
            <button onClick={openCustom}
              className={`w-full text-left px-3.5 py-2.5 rounded-xl text-sm flex items-center justify-between transition-colors ${filter.mode === 'custom' ? 'bg-white/10 text-white' : 'text-white/70 hover:bg-white/5 hover:text-white'}`}>
              Custom Range
              <Icon name="chevronRight" size={12} className="text-white/30" />
            </button>
          </div>
        </>
      ) : null}

      <Modal open={customOpen} onClose={() => setCustomOpen(false)} title="Custom Range">
        <div className="space-y-4">
          <div>
            <span className="block text-xs font-medium text-white/50 mb-1.5">Start Date</span>
            <div className="grid grid-cols-3 gap-2">
              <select className={selectCls} value={startDay} onChange={e => setStartDay(Number(e.target.value))}>
                {DAY_OPTIONS.map(d => <option key={d} value={d}>{d}</option>)}
              </select>
              <select className={selectCls} value={startMonth} onChange={e => setStartMonth(Number(e.target.value))}>
                {MONTH_OPTIONS.map((m, i) => <option key={m} value={i}>{m}</option>)}
              </select>
              <select className={selectCls} value={startYear} onChange={e => setStartYear(Number(e.target.value))}>
                {YEAR_OPTIONS.map(y => <option key={y} value={y}>{y}</option>)}
              </select>
            </div>
          </div>
          <div>
            <span className="block text-xs font-medium text-white/50 mb-1.5">End Date</span>
            <div className="grid grid-cols-3 gap-2">
              <select className={selectCls} value={endDay} onChange={e => setEndDay(Number(e.target.value))}>
                {DAY_OPTIONS.map(d => <option key={d} value={d}>{d}</option>)}
              </select>
              <select className={selectCls} value={endMonth} onChange={e => setEndMonth(Number(e.target.value))}>
                {MONTH_OPTIONS.map((m, i) => <option key={m} value={i}>{m}</option>)}
              </select>
              <select className={selectCls} value={endYear} onChange={e => setEndYear(Number(e.target.value))}>
                {YEAR_OPTIONS.map(y => <option key={y} value={y}>{y}</option>)}
              </select>
            </div>
          </div>
          <div className="flex gap-3 pt-2">
            <Button type="button" onClick={applyCustom} accent={`linear-gradient(135deg,${accent},${accent})`} className="flex-1 justify-center">Apply</Button>
            <Button type="button" variant="ghost" onClick={resetCustom} className="flex-1 justify-center">Reset</Button>
            <Button type="button" variant="ghost" onClick={() => setCustomOpen(false)} className="flex-1 justify-center">Cancel</Button>
          </div>
        </div>
      </Modal>
    </div>
  );
}

// GENERIC TRANSACTION VIEW (Expenses / Income)

function TransactionView({ title, accent, icon, items, setItems, categories, kind }: {
  title: string; accent: string; icon: string; items: (Expense | Income)[]; setItems: any; categories: string[]; kind: 'Expense' | 'Income';
}) {
  const [modalOpen, setModalOpen] = useState(false);
  const [editing, setEditing] = useState<any>(null);
  const [confirmId, setConfirmId] = useState<ID | null>(null);
  const [monthFilter, setMonthFilter] = useState('all');
  const [expenseFilter, setExpenseFilter] = useLocalStorageState<DateFilterState>('expenseDateFilter', { mode: 'all', start: '', end: '' });
  const [form, setForm] = useState({ amount: '', category: categories[0], description: '', date: todayISO() });

  const isExpense = kind === 'Expense';
  const months = useMemo(() => Array.from(new Set(items.map(i => monthKey(i.date)))).sort().reverse(), [items]);
  const filtered = useMemo(() => {
    if (isExpense) {
      const { start, end } = resolveDateRange(expenseFilter);
      if (!start && !end) return items;
      return items.filter(i => (!start || i.date >= start) && (!end || i.date <= end));
    }
    return monthFilter === 'all' ? items : items.filter(i => monthKey(i.date) === monthFilter);
  }, [items, monthFilter, isExpense, expenseFilter]);
  const sorted = useMemo(() => [...filtered].sort((a, b) => (b.date > a.date ? 1 : -1)), [filtered]);
  const total = useMemo(() => filtered.reduce((s, i) => s + i.amount, 0), [filtered]);

  const categoryTotals: Record<string, number> = {};
  filtered.forEach(i => { categoryTotals[i.category] = (categoryTotals[i.category] || 0) + i.amount; });

  function openAdd() {
    setEditing(null);
    setForm({ amount: '', category: categories[0], description: '', date: todayISO() });
    setModalOpen(true);
  }
  function openEdit(item: any) {
    setEditing(item);
    setForm({ amount: String(item.amount), category: item.category, description: item.description, date: item.date });
    setModalOpen(true);
  }
  function save(e: React.FormEvent) {
    e.preventDefault();
    const amount = parseFloat(form.amount);
    if (!amount || amount <= 0) return;
    if (editing) {
      setItems((prev: any[]) => prev.map(i => i.id === editing.id ? { ...i, ...form, amount } : i));
    } else {
      setItems((prev: any[]) => [...prev, { id: uid(), ...form, amount }]);
    }
    setModalOpen(false);
  }
  function remove(id: ID) {
    setItems((prev: any[]) => prev.filter(i => i.id !== id));
    setConfirmId(null);
  }

  const doughnutConfig = {
    type: 'doughnut',
    data: { labels: Object.keys(categoryTotals), datasets: [{ data: Object.values(categoryTotals), backgroundColor: CHART_PALETTE, borderWidth: 0 }] },
    options: { ...baseChartOptions(), cutout: '68%' },
  };

  return (
    <div className="view-enter space-y-6">

// FOREX JOURNAL
// ============================================================
function ForexView({ trades, setTrades }: { trades: ForexTrade[]; setTrades: any }) {
  const [modalOpen, setModalOpen] = useState(false);
  const [editing, setEditing] = useState<ForexTrade | null>(null);
  const [confirmId, setConfirmId] = useState<ID | null>(null);
  const empty = { pair: '', direction: 'Buy' as 'Buy' | 'Sell', entryPrice: '', exitPrice: '', lotSize: '1', status: 'Open' as 'Open' | 'Closed', date: todayISO(), notes: '' };
  const [form, setForm] = useState<any>(empty);

  const closed = trades.filter(t => t.status === 'Closed' && t.exitPrice != null);
  const wins = closed.filter(t => tradePnl(t) > 0);
  const totalPnl = closed.reduce((s, t) => s + tradePnl(t), 0);
  const winRate = closed.length ? (wins.length / closed.length) * 100 : 0;
  const avgWin = wins.length ? wins.reduce((s, t) => s + tradePnl(t), 0) / wins.length : 0;
  const losses = closed.filter(t => tradePnl(t) <= 0);
  const avgLoss = losses.length ? losses.reduce((s, t) => s + tradePnl(t), 0) / losses.length : 0;

  const sorted = [...trades].sort((a, b) => (b.date > a.date ? 1 : -1));
  let cum = 0;
  const cumSeries = [...closed].sort((a, b) => (a.date > b.date ? 1 : -1)).map(t => { cum += tradePnl(t); return cum; });
  const cumLabels = [...closed].sort((a, b) => (a.date > b.date ? 1 : -1)).map(t => formatDate(t.date));

  function openAdd() { setEditing(null); setForm(empty); setModalOpen(true); }
  function openEdit(t: ForexTrade) {
    setEditing(t);
    setForm({ pair: t.pair, direction: t.direction, entryPrice: String(t.entryPrice), exitPrice: t.exitPrice != null ? String(t.exitPrice) : '', lotSize: String(t.lotSize), status: t.status, date: t.date, notes: t.notes });
    setModalOpen(true);
  }
  function save(e: React.FormEvent) {
    e.preventDefault();
    const entryPrice = parseFloat(form.entryPrice);
    const lotSize = parseFloat(form.lotSize) || 1;
    const exitPrice = form.exitPrice !== '' ? parseFloat(form.exitPrice) : null;
    if (!form.pair || !entryPrice) return;
    const payload = { pair: form.pair.toUpperCase(), direction: form.direction, entryPrice, exitPrice, lotSize, status: form.status, date: form.date, notes: form.notes };
    if (editing) setTrades((prev: ForexTrade[]) => prev.map(t => t.id === editing.id ? { ...t, ...payload } : t));
    else setTrades((prev: ForexTrade[]) => [...prev, { id: uid(), ...payload }]);
    setModalOpen(false);
  }
  function remove(id: ID) { setTrades((prev: ForexTrade[]) => prev.filter(t => t.id !== id)); setConfirmId(null); }

  const winRateConfig = {
    type: 'doughnut',
    data: { labels: ['Wins', 'Losses'], datasets: [{ data: [wins.length, losses.length], backgroundColor: ['#34D399', '#FB7185'], borderWidth: 0 }] },
    options: { ...baseChartOptions(), cutout: '70%' },
  };
  const cumConfig = {
    type: 'line',
    data: { labels: cumLabels, datasets: [{ label: 'Cumulative P&L', data: cumSeries, borderColor: '#818CF8', backgroundColor: 'rgba(129,140,248,0.15)', fill: true, tension: 0.35, pointRadius: 2 }] },
    options: baseChartOptions(),
  };

  return (
    <div className="view-enter space-y-6">
      <div className="flex flex-wrap items-center justify-between gap-3">
        <div className="flex items-center gap-3">
          <div className="w-11 h-11 rounded-xl flex items-center justify-center bg-indigo-400/15 text-indigo-400"><Icon name="activity" size={20} /></div>
          <div><h2 className="text-xl font-display font-bold">Forex Trading Journal</h2><p className="text-sm text-white/40">{trades.length} trades logged</p></div>
        </div>
        <Button onClick={openAdd} accent="linear-gradient(135deg,#818CF8,#6366F1)"><Icon name="plus" size={16} />Log Trade</Button>
      </div>

      <div className="grid grid-cols-2 lg:grid-cols-4 gap-4">
        <StatCard label="Total P&L" value={formatINR(totalPnl)} icon="activity" accent="#818CF8" />
        <StatCard label="Win Rate" value={`${formatNum(winRate, 1)}%`} icon="target" accent="#34D399" sub={`${wins.length}/${closed.length} closed`} />
        <StatCard label="Avg Win" value={formatINR(avgWin)} icon="arrowUp" accent="#34D399" />
        <StatCard label="Avg Loss" value={formatINR(avgLoss)} icon="arrowDown" accent="#FB7185" />
      </div>

      <div className="grid grid-cols-1 xl:grid-cols-3 gap-6">
        <Card className="xl:col-span-2">
          <h3 className="font-display font-semibold mb-4">Cumulative P&L</h3>
          {closed.length ? <ChartCanvas config={cumConfig} /> : <EmptyState icon="activity" title="No closed trades" sub="Close a trade to see your P&L curve" />}
        </Card>
        <Card>
          <h3 className="font-display font-semibold mb-4">Win / Loss</h3>
          {closed.length ? <ChartCanvas config={winRateConfig} height={220} /> : <EmptyState icon="target" title="No data yet" sub="Win rate appears after closed trades" />}
        </Card>
      </div>

      <Card className="!p-0 overflow-hidden">
        {sorted.length === 0 ? <div className="p-6"><EmptyState icon="activity" title="No trades yet" sub="Log your first forex trade to begin your journal" /></div> : (
          <div className="overflow-x-auto">
            <table className="w-full text-sm">
              <thead>
                <tr className="text-left text-xs uppercase tracking-wider text-white/40 border-b border-white/10">
                  <th className="px-5 py-3 font-medium">Pair</th>
                  <th className="px-5 py-3 font-medium">Direction</th>
                  <th className="px-5 py-3 font-medium">Entry</th>
                  <th className="px-5 py-3 font-medium">Exit</th>
                  <th className="px-5 py-3 font-medium">Lot</th>
                  <th className="px-5 py-3 font-medium">Status</th>
                  <th className="px-5 py-3 font-medium">Date</th>
                  <th className="px-5 py-3 font-medium text-right">P&L</th>
                  <th className="px-5 py-3 font-medium text-right">Actions</th>
                </tr>
              </thead>
              <tbody>
                {sorted.map(t => {
                  const pnl = tradePnl(t);
                  return (
                    <tr key={t.id} className="border-b border-white/5 last:border-0 hover:bg-white/[0.02]">
                      <td className="px-5 py-3 font-semibold">{t.pair}</td>
                      <td className="px-5 py-3"><Pill color={t.direction === 'Buy' ? '#34D399' : '#FB7185'}>{t.direction}</Pill></td>
                      <td className="px-5 py-3 tabular-nums text-white/70">{formatNum(t.entryPrice, 4)}</td>
                      <td className="px-5 py-3 tabular-nums text-white/70">{t.exitPrice != null ? formatNum(t.exitPrice, 4) : '—'}</td>
                      <td className="px-5 py-3 tabular-nums text-white/70">{t.lotSize}</td>
                      <td className="px-5 py-3"><Pill color={t.status === 'Open' ? '#F59E0B' : '#38BDF8'}>{t.status}</Pill></td>
                      <td className="px-5 py-3 text-white/50">{formatDate(t.date)}</td>
                      <td className={`px-5 py-3 text-right font-semibold tabular-nums ${pnl > 0 ? 'text-emerald-400' : pnl < 0 ? 'text-rose-400' : 'text-white/50'}`}>{t.status === 'Closed' ? formatINR(pnl) : '—'}</td>
                      <td className="px-5 py-3">
                        {confirmId === t.id ? (
                          <ConfirmBar label="Delete trade?" onConfirm={() => remove(t.id)} onCancel={() => setConfirmId(null)} />
                        ) : (
                          <div className="flex items-center justify-end gap-2">
                            <IconButton icon="edit" onClick={() => openEdit(t)} title="Edit" />
                            <IconButton icon="trash" danger onClick={() => setConfirmId(t.id)} title="Delete" />
                          </div>
                        )}
                      </td>
                    </tr>
                  );
                })}
              </tbody>
            </table>
          </div>
        )}
      </Card>

      <Modal open={modalOpen} onClose={() => setModalOpen(false)} title={editing ? 'Edit Trade' : 'Log Trade'} wide>
        <form onSubmit={save} className="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <Field label="Currency Pair"><input required className={inputCls} value={form.pair} onChange={e => setForm({ ...form, pair: e.target.value })} placeholder="EUR/USD" /></Field>
          <Field label="Direction">
            <select className={inputCls} value={form.direction} onChange={e => setForm({ ...form, direction: e.target.value })}>
              <option>Buy</option><option>Sell</option>
            </select>
          </Field>
          <Field label="Entry Price"><input required type="number" step="0.0001" className={inputCls} value={form.entryPrice} onChange={e => setForm({ ...form, entryPrice: e.target.value })} /></Field>
          <Field label="Exit Price (leave blank if open)"><input type="number" step="0.0001" className={inputCls} value={form.exitPrice} onChange={e => setForm({ ...form, exitPrice: e.target.value })} /></Field>
          <Field label="Lot Size"><input required type="number" step="0.01" className={inputCls} value={form.lotSize} onChange={e => setForm({ ...form, lotSize: e.target.value })} /></Field>
          <Field label="Status">
            <select className={inputCls} value={form.status} onChange={e => setForm({ ...form, status: e.target.value })}>
              <option>Open</option><option>Closed</option>
            </select>
          </Field>
          <Field label="Date"><input required type="date" className={inputCls} value={form.date} onChange={e => setForm({ ...form, date: e.target.value })} /></Field>
          <div className="sm:col-span-2"><Field label="Notes"><textarea className={inputCls} rows={2} value={form.notes} onChange={e => setForm({ ...form, notes: e.target.value })} placeholder="Setup, reasoning, lessons learned..." /></Field></div>
          <div className="sm:col-span-2 flex gap-3 pt-2">
            <Button type="submit" accent="linear-gradient(135deg,#818CF8,#6366F1)" className="flex-1 justify-center">{editing ? 'Save Changes' : 'Log Trade'}</Button>
            <Button variant="ghost" onClick={() => setModalOpen(false)} className="flex-1 justify-center">Cancel</Button>
          </div>
        </form>
      </Modal>
    </div>
  );
}

function CryptoView({ holdings, setHoldings }: { holdings: CryptoHolding[]; setHoldings: any }) {
  const [modalOpen, setModalOpen] = useState(false);
  const [editing, setEditing] = useState<CryptoHolding | null>(null);
  const [confirmId, setConfirmId] = useState<ID | null>(null);
  const empty = { coin: '', symbol: '', quantity: '', avgBuyPrice: '', currentPrice: '', date: todayISO() };
  const [form, setForm] = useState<any>(empty);

  const totalInvestment = holdings.reduce((s, h) => s + h.avgBuyPrice * h.quantity, 0);
  const totalValue = holdings.reduce((s, h) => s + h.currentPrice * h.quantity, 0);
  const totalPnl = totalValue - totalInvestment;
  const pnlPct = totalInvestment ? (totalPnl / totalInvestment) * 100 : 0;

  function openAdd() { setEditing(null); setForm(empty); setModalOpen(true); }
  function openEdit(h: CryptoHolding) {
    setEditing(h);
    setForm({ coin: h.coin, symbol: h.symbol, quantity: String(h.quantity), avgBuyPrice: String(h.avgBuyPrice), currentPrice: String(h.currentPrice), date: h.date });
    setModalOpen(true);
  }
  function save(e: React.FormEvent) {
    e.preventDefault();
    const quantity = parseFloat(form.quantity), avgBuyPrice = parseFloat(form.avgBuyPrice), currentPrice = parseFloat(form.currentPrice);
    if (!form.coin || !quantity || !avgBuyPrice) return;
    const payload = { coin: form.coin, symbol: form.symbol.toUpperCase(), quantity, avgBuyPrice, currentPrice: currentPrice || avgBuyPrice, date: form.date };
    if (editing) setHoldings((prev: CryptoHolding[]) => prev.map(h => h.id === editing.id ? { ...h, ...payload } : h));
    else setHoldings((prev: CryptoHolding[]) => [...prev, { id: uid(), ...payload }]);
    setModalOpen(false);
  }
  function remove(id: ID) { setHoldings((prev: CryptoHolding[]) => prev.filter(h => h.id !== id)); setConfirmId(null); }

  const allocConfig = {
    type: 'doughnut',
    data: { labels: holdings.map(h => h.symbol || h.coin), datasets: [{ data: holdings.map(h => h.currentPrice * h.quantity), backgroundColor: CHART_PALETTE, borderWidth: 0 }] },
    options: { ...baseChartOptions(), cutout: '68%' },
  };
  const pnlConfig = {
    type: 'bar',
    data: { labels: holdings.map(h => h.symbol || h.coin), datasets: [{ label: 'P&L', data: holdings.map(h => (h.currentPrice - h.avgBuyPrice) * h.quantity), backgroundColor: holdings.map(h => (h.currentPrice - h.avgBuyPrice) >= 0 ? '#34D399' : '#FB7185'), borderRadius: 6, maxBarThickness: 28 }] },
    options: baseChartOptions(),
  };

  return (
    <div className="view-enter space-y-6">
      <div className="flex flex-wrap items-center justify-between gap-3">
        <div className="flex items-center gap-3">
          <div className="w-11 h-11 rounded-xl flex items-center justify-center bg-amber-400/15 text-amber-400"><Icon name="coin" size={20} /></div>
          <div><h2 className="text-xl font-display font-bold">Crypto Portfolio</h2><p className="text-sm text-white/40">{holdings.length} holdings</p></div>
        </div>
        <Button onClick={openAdd} accent="linear-gradient(135deg,#F59E0B,#D97706)"><Icon name="plus" size={16} />Add Holding</Button>
      </div>

      <div className="grid grid-cols-2 lg:grid-cols-4 gap-4">
        <StatCard label="Total Investment" value={formatINR(totalInvestment)} icon="coin" accent="#F59E0B" />
        <StatCard label="Current Value" value={formatINR(totalValue)} icon="trendingUp" accent="#34D399" />
        <StatCard label="Total P&L" value={formatINR(totalPnl)} icon="activity" accent={totalPnl >= 0 ? '#34D399' : '#FB7185'} />
        <StatCard label="Return" value={`${pnlPct >= 0 ? '+' : ''}${formatNum(pnlPct, 1)}%`} icon="target" accent={pnlPct >= 0 ? '#34D399' : '#FB7185'} />
      </div>

      <div className="grid grid-cols-1 xl:grid-cols-3 gap-6">
        <Card className="xl:col-span-2">
          <h3 className="font-display font-semibold mb-4">P&L by Coin</h3>
          {holdings.length ? <ChartCanvas config={pnlConfig} /> : <EmptyState icon="coin" title="No holdings yet" sub="Add a coin to see performance" />}
        </Card>
        <Card>
          <h3 className="font-display font-semibold mb-4">Allocation</h3>
          {holdings.length ? <ChartCanvas config={allocConfig} height={220} /> : <EmptyState icon="coin" title="No allocation data" sub="Add holdings to see the split" />}
        </Card>
      </div>

      <Card className="!p-0 overflow-hidden">
        {holdings.length === 0 ? <div className="p-6"><EmptyState icon="coin" title="No holdings yet" sub="Track your crypto investments here" /></div> : (
          <div className="overflow-x-auto">
            <table className="w-full text-sm">
              <thead>
                <tr className="text-left text-xs uppercase tracking-wider text-white/40 border-b border-white/10">
                  <th className="px-5 py-3 font-medium">Coin</th>
                  <th className="px-5 py-3 font-medium">Qty</th>
                  <th className="px-5 py-3 font-medium">Avg Buy</th>
                  <th className="px-5 py-3 font-medium">Current</th>
                  <th className="px-5 py-3 font-medium">Investment</th>
                  <th className="px-5 py-3 font-medium">Value</th>
                  <th className="px-5 py-3 font-medium text-right">P&L</th>
                  <th className="px-5 py-3 font-medium text-right">Actions</th>
                </tr>
              </thead>
              <tbody>
                {holdings.map(h => {
                  const inv = h.avgBuyPrice * h.quantity, val = h.currentPrice * h.quantity, pnl = val - inv;
                  return (
                    <tr key={h.id} className="border-b border-white/5 last:border-0 hover:bg-white/[0.02]">
                      <td className="px-5 py-3 font-semibold">{h.coin} <span className="text-white/40 font-normal">{h.symbol}</span></td>
                      <td className="px-5 py-3 tabular-nums text-white/70">{formatNum(h.quantity, 4)}</td>
                      <td className="px-5 py-3 tabular-nums text-white/70">{formatINR(h.avgBuyPrice)}</td>
                      <td className="px-5 py-3 tabular-nums text-white/70">{formatINR(h.currentPrice)}</td>
                      <td className="px-5 py-3 tabular-nums text-white/70">{formatINR(inv)}</td>
                      <td className="px-5 py-3 tabular-nums text-white/70">{formatINR(val)}</td>
                      <td className={`px-5 py-3 text-right font-semibold tabular-nums ${pnl >= 0 ? 'text-emerald-400' : 'text-rose-400'}`}>{formatINR(pnl)}</td>
                      <td className="px-5 py-3">
                        {confirmId === h.id ? (
                          <ConfirmBar label="Delete holding?" onConfirm={() => remove(h.id)} onCancel={() => setConfirmId(null)} />
                        ) : (
                          <div className="flex items-center justify-end gap-2">
                            <IconButton icon="edit" onClick={() => openEdit(h)} title="Edit" />
                            <IconButton icon="trash" danger onClick={() => setConfirmId(h.id)} title="Delete" />
                          </div>
                        )}
                      </td>
                    </tr>
                  );
                })}
              </tbody>
            </table>
          </div>
        )}
      </Card>

      <Modal open={modalOpen} onClose={() => setModalOpen(false)} title={editing ? 'Edit Holding' : 'Add Holding'} wide>
        <form onSubmit={save} className="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <Field label="Coin Name"><input required className={inputCls} value={form.coin} onChange={e => setForm({ ...form, coin: e.target.value })} placeholder="Bitcoin" /></Field>
          <Field label="Symbol"><input className={inputCls} value={form.symbol} onChange={e => setForm({ ...form, symbol: e.target.value })} placeholder="BTC" /></Field>
          <Field label="Quantity"><input required type="number" step="0.00000001" className={inputCls} value={form.quantity} onChange={e => setForm({ ...form, quantity: e.target.value })} /></Field>
          <Field label="Avg Buy Price (₹)"><input required type="number" step="0.01" className={inputCls} value={form.avgBuyPrice} onChange={e => setForm({ ...form, avgBuyPrice: e.target.value })} /></Field>
          <Field label="Current Price (₹)"><input type="number" step="0.01" className={inputCls} value={form.currentPrice} onChange={e => setForm({ ...form, currentPrice: e.target.value })} placeholder="Defaults to buy price" /></Field>
          <Field label="Date Acquired"><input required type="date" className={inputCls} value={form.date} onChange={e => setForm({ ...form, date: e.target.value })} /></Field>
          <div className="sm:col-span-2 flex gap-3 pt-2">
            <Button type="submit" accent="linear-gradient(135deg,#F59E0B,#D97706)" className="flex-1 justify-center">{editing ? 'Save Changes' : 'Add Holding'}</Button>
            <Button variant="ghost" onClick={() => setModalOpen(false)} className="flex-1 justify-center">Cancel</Button>
          </div>
        </form>
      </Modal>
    </div>
  );
}

  const [form, setForm] = useState<any>(empty);

  const activeMeta = BUSINESS_TYPES.find(b => b.key === activeType)!;
  const items = business.filter(b => b.type === activeType).sort((a, b) => (b.date > a.date ? 1 : -1));
  const revenue = items.reduce((s, b) => s + b.revenue, 0);
  const expense = items.reduce((s, b) => s + b.expense, 0);
  const profit = revenue - expense;

  const overviewByType = BUSINESS_TYPES.map(bt => business.filter(b => b.type === bt.key).reduce((s, b) => s + (b.revenue - b.expense), 0));

  function openAdd() { setEditing(null); setForm(empty); setModalOpen(true); }
  function openEdit(b: BusinessEntry) {
    setEditing(b);
    setForm({ description: b.description, revenue: String(b.revenue), expense: String(b.expense), date: b.date });
    setModalOpen(true);
  }
  function save(e: React.FormEvent) {
    e.preventDefault();
    const revenue = parseFloat(form.revenue) || 0, expense = parseFloat(form.expense) || 0;
    if (!form.description) return;
    const payload = { type: activeType, description: form.description, revenue, expense, date: form.date };
    if (editing) setBusiness((prev: BusinessEntry[]) => prev.map(b => b.id === editing.id ? { ...b, ...payload } : b));
    else setBusiness((prev: BusinessEntry[]) => [...prev, { id: uid(), ...payload }]);
    setModalOpen(false);
  }
  function remove(id: ID) { setBusiness((prev: BusinessEntry[]) => prev.filter(b => b.id !== id)); setConfirmId(null); }

  const overviewConfig = {
    type: 'bar',
    data: { labels: BUSINESS_TYPES.map(b => b.label), datasets: [{ label: 'Profit', data: overviewByType, backgroundColor: BUSINESS_TYPES.map(b => b.color), borderRadius: 8, maxBarThickness: 40 }] },
    options: baseChartOptions({ plugins: { legend: { display: false } } }),
  };

  return (
    <div className="view-enter space-y-6">
      <div className="flex items-center gap-3">
        <div className="w-11 h-11 rounded-xl flex items-center justify-center" style={{ background: '#D4AF3722', color: '#D4AF37' }}><Icon name="briefcase" size={20} /></div>
        <div><h2 className="text-xl font-display font-bold">Business Profit Tracker</h2><p className="text-sm text-white/40">Dropshipping · Dropservicing · Media Agency · Interest Income</p></div>
      </div>

      <Card>
        <h3 className="font-display font-semibold mb-4">Profit by Business Line</h3>
        <ChartCanvas config={overviewConfig} height={220} />
      </Card>

      <div className="flex flex-wrap gap-2">
        {BUSINESS_TYPES.map(bt => (
          <button key={bt.key} onClick={() => setActiveType(bt.key)}
            className={`px-4 py-2 rounded-xl text-sm font-semibold border transition-all focus-ring ${activeType === bt.key ? 'text-black' : 'bg-white/5 border-white/10 text-white/60 hover:bg-white/10'}`}
            style={activeType === bt.key ? { background: bt.color, borderColor: bt.color } : {}}>
            {bt.label}
          </button>
        ))}
      </div>

      <div className="flex flex-wrap items-center justify-between gap-3">
        <div className="grid grid-cols-3 gap-4 flex-1">
          <StatCard label="Revenue" value={formatINR(revenue)} icon="trendingUp" accent={activeMeta.color} />
          <StatCard label="Expenses" value={formatINR(expense)} icon="wallet" accent="#FB7185" />
          <StatCard label="Profit" value={formatINR(profit)} icon="target" accent={profit >= 0 ? '#34D399' : '#FB7185'} />
        </div>
      </div>

      <Card className="!p-0 overflow-hidden">
        <div className="flex items-center justify-between p-5 pb-0">
          <h3 className="font-display font-semibold">{activeMeta.label} Entries</h3>
          <Button onClick={openAdd} accent={`linear-gradient(135deg,${activeMeta.color},${activeMeta.color})`}><Icon name="plus" size={16} />Add Entry</Button>
        </div>
        {items.length === 0 ? <div className="p-6"><EmptyState icon="briefcase" title={`No ${activeMeta.label} entries yet`} sub="Log revenue and expenses for this business line" /></div> : (
          <div className="overflow-x-auto mt-3">
            <table className="w-full text-sm">
              <thead>
                <tr className="text-left text-xs uppercase tracking-wider text-white/40 border-b border-white/10">
                  <th className="px-5 py-3 font-medium">Description</th>
                  <th className="px-5 py-3 font-medium">Date</th>
                  <th className="px-5 py-3 font-medium text-right">Revenue</th>
                  <th className="px-5 py-3 font-medium text-right">Expense</th>
                  <th className="px-5 py-3 font-medium text-right">Profit</th>
                  <th className="px-5 py-3 font-medium text-right">Actions</th>
                </tr>
              </thead>
              <tbody>
                {items.map(b => (
                  <tr key={b.id} className="border-b border-white/5 last:border-0 hover:bg-white/[0.02]">
                    <td className="px-5 py-3 font-medium">{b.description}</td>
                    <td className="px-5 py-3 text-white/50">{formatDate(b.date)}</td>
                    <td className="px-5 py-3 text-right tabular-nums text-emerald-400">{formatINR(b.revenue)}</td>
                    <td className="px-5 py-3 text-right tabular-nums text-rose-400">{formatINR(b.expense)}</td>
                    <td className={`px-5 py-3 text-right font-semibold tabular-nums ${b.revenue - b.expense >= 0 ? 'text-emerald-400' : 'text-rose-400'}`}>{formatINR(b.revenue - b.expense)}</td>
                    <td className="px-5 py-3">
                      {confirmId === b.id ? (
                        <ConfirmBar label="Delete entry?" onConfirm={() => remove(b.id)} onCancel={() => setConfirmId(null)} />
                      ) : (
                        <div className="flex items-center justify-end gap-2">
                          <IconButton icon="edit" onClick={() => openEdit(b)} title="Edit" />
                          <IconButton icon="trash" danger onClick={() => setConfirmId(b.id)} title="Delete" />

                      )}

                ))}
              </tbody>
            </table>
          </div>
        )}
      </Card>

      <Modal open={modalOpen} onClose={() => setModalOpen(false)} title={editing ? `Edit ${activeMeta.label} Entry` : `Add ${activeMeta.label} Entry`}>
        <form onSubmit={save} className="space-y-4">
          <Field label="Description"><input required className={inputCls} value={form.description} onChange={e => setForm({ ...form, description: e.target.value })} placeholder="e.g. Store sales, client project" /></Field>
          <div className="grid grid-cols-2 gap-4">
            <Field label="Revenue (₹)"><input type="number" step="0.01" className={inputCls} value={form.revenue} onChange={e => setForm({ ...form, revenue: e.target.value })} /></Field>
            <Field label="Expense (₹)"><input type="number" step="0.01" className={inputCls} value={form.expense} onChange={e => setForm({ ...form, expense: e.target.value })} /></Field>

        </form>
      </Modal>
    </div>
  );
}

function SchedulerView({ meetings, setMeetings }: { meetings: Meeting[]; setMeetings: any }) {
  const [modalOpen, setModalOpen] = useState(false);
  const [editing, setEditing] = useState<Meeting | null>(null);
  const [confirmId, setConfirmId] = useState<ID | null>(null);
  const [cursor, setCursor] = useState(new Date());
  const [selectedDate, setSelectedDate] = useState<string | null>(null);
  const empty = { title: '', date: todayISO(), time: '10:00', notes: '', reminder: true };
  const [form, setForm] = useState<any>(empty);

  const year = cursor.getFullYear(), month = cursor.getMonth();
  const firstDay = new Date(year, month, 1);
  const startOffset = firstDay.getDay();
  const daysInMonth = new Date(year, month + 1, 0).getDate();
  const cells: (number | null)[] = [...Array(startOffset).fill(null), ...Array.from({ length: daysInMonth }, (_, i) => i + 1)];

  const meetingsByDate: Record<string, Meeting[]> = {};
  meetings.forEach(m => { (meetingsByDate[m.date] ||= []).push(m); });

  const listSource = selectedDate ? (meetingsByDate[selectedDate] || []) : [...meetings].sort((a, b) => (a.date + a.time).localeCompare(b.date + b.time));

  function openAdd() { setEditing(null); setForm({ ...empty, date: selectedDate || todayISO() }); setModalOpen(true); }
  function openEdit(m: Meeting) { setEditing(m); setForm({ title: m.title, date: m.date, time: m.time, notes: m.notes, reminder: m.reminder }); setModalOpen(true); }
  function save(e: React.FormEvent) {
    e.preventDefault();
    if (!form.title || !form.date) return;
    if (editing) setMeetings((prev: Meeting[]) => prev.map(m => m.id === editing.id ? { ...m, ...form, completed: m.completed } : m));
    else setMeetings((prev: Meeting[]) => [...prev, { id: uid(), ...form, completed: false }]);
    setModalOpen(false);
  }
  function remove(id: ID) { setMeetings((prev: Meeting[]) => prev.filter(m => m.id !== id)); setConfirmId(null); }
  function toggleComplete(id: ID) { setMeetings((prev: Meeting[]) => prev.map(m => m.id === id ? { ...m, completed: !m.completed } : m)); }

  const todayStr = todayISO();

  return (
    <div className="view-enter space-y-6">
      <div className="flex items-center gap-3">
        <div className="w-11 h-11 rounded-xl flex items-center justify-center bg-sky-400/15 text-sky-400"><Icon name="calendar" size={20} /></div>
        <div><h2 className="text-xl font-display font-bold">Meeting Scheduler</h2><p className="text-sm text-white/40">{meetings.filter(m => !m.completed).length} upcoming</p></div>
      </div>

      <div className="grid grid-cols-1 xl:grid-cols-3 gap-6">
        <Card className="xl:col-span-2">
          <div className="flex items-center justify-between mb-4">
            <h3 className="font-display font-semibold">{cursor.toLocaleDateString('en-IN', { month: 'long', year: 'numeric' })}</h3>
            <div className="flex items-center gap-2">
              <IconButton icon="chevronLeft" onClick={() => setCursor(new Date(year, month - 1, 1))} />
              <button onClick={() => { setCursor(new Date()); setSelectedDate(todayStr); }} className="text-xs px-2.5 py-1 rounded-lg bg-white/5 hover:bg-white/10 text-white/60">Today</button>
              <IconButton icon="chevronRight" onClick={() => setCursor(new Date(year, month + 1, 1))} />
            </div>
          </div>
          <div className="grid grid-cols-7 gap-1.5 text-center text-xs text-white/40 mb-2">
            {['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map(d => <div key={d} className="py-1 font-medium">{d}</div>)}
          </div>
          <div className="grid grid-cols-7 gap-1.5">
            {cells.map((day, idx) => {
              if (day === null) return <div key={idx}></div>;
              const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
              const has = meetingsByDate[dateStr]?.length;
              const isToday = dateStr === todayStr;
              const isSelected = dateStr === selectedDate;
              return (
                <button key={idx} onClick={() => setSelectedDate(isSelected ? null : dateStr)}
                  className={`aspect-square rounded-lg text-sm flex flex-col items-center justify-center gap-0.5 transition-all border ${isSelected ? 'border-sky-400 bg-sky-400/15 text-sky-300' : isToday ? 'border-emerald-400/40 text-emerald-300' : 'border-transparent hover:bg-white/5 text-white/70'}`}>
                  <span>{day}</span>
                  {has ? <span className="w-1 h-1 rounded-full bg-sky-400"></span> : null}
                </button>
              );
            })}
          </div>
        </Card>
        <Card>
          <div className="flex items-center justify-between mb-4">
            <h3 className="font-display font-semibold">{selectedDate ? formatDate(selectedDate) : 'All Meetings'}</h3>
            <Button onClick={openAdd} accent="linear-gradient(135deg,#38BDF8,#0EA5E9)" className="!px-3 !py-1.5"><Icon name="plus" size={14} /></Button>
          </div>
          {selectedDate ? <button onClick={() => setSelectedDate(null)} className="text-xs text-sky-400 mb-3 hover:underline">Show all meetings</button> : null}
          <div className="space-y-2.5 max-h-[360px] overflow-y-auto scrollbar-thin pr-1">
            {listSource.length === 0 ? <EmptyState icon="calendar" title="No meetings" sub="Add a meeting to get started" /> : listSource.map(m => (
              <div key={m.id} className={`rounded-xl p-3 border ${m.completed ? 'border-white/5 bg-white/[0.02] opacity-50' : 'border-white/10 bg-white/[0.03]'}`}>
                <div className="flex items-start justify-between gap-2">
                  <div className="min-w-0">
                    <div className={`text-sm font-medium truncate ${m.completed ? 'line-through' : ''}`}>{m.title}</div>
                    <div className="text-xs text-white/40 flex items-center gap-1 mt-0.5"><Icon name="clock" size={11} />{formatDate(m.date)} · {m.time}{m.reminder ? <Icon name="bell" size={11} className="ml-1" /> : null}</div>
                    {m.notes ? <div className="text-xs text-white/40 mt-1">{m.notes}</div> : null}
                  </div>
                  <div className="flex items-center gap-1 shrink-0">
                    <IconButton icon="check" onClick={() => toggleComplete(m.id)} title="Toggle complete" />
                    <IconButton icon="edit" onClick={() => openEdit(m)} title="Edit" />
                    <IconButton icon="trash" danger onClick={() => setConfirmId(m.id)} title="Delete" />
                  </div>
                </div>
                {confirmId === m.id ? <div className="mt-2"><ConfirmBar label="Delete meeting?" onConfirm={() => remove(m.id)} onCancel={() => setConfirmId(null)} /></div> : null}
              </div>
            ))}
          </div>
        </Card>
      </div>

      <Modal open={modalOpen} onClose={() => setModalOpen(false)} title={editing ? 'Edit Meeting' : 'Add Meeting'}>
        <form onSubmit={save} className="space-y-4">
          <Field label="Title"><input required className={inputCls} value={form.title} onChange={e => setForm({ ...form, title: e.target.value })} placeholder="Client call, review, etc." /></Field>
          <div className="grid grid-cols-2 gap-4">
            <Field label="Date"><input required type="date" className={inputCls} value={form.date} onChange={e => setForm({ ...form, date: e.target.value })} /></Field>
            <Field label="Time"><input required type="time" className={inputCls} value={form.time} onChange={e => setForm({ ...form, time: e.target.value })} /></Field>
          </div>
          <Field label="Notes"><textarea className={inputCls} rows={2} value={form.notes} onChange={e => setForm({ ...form, notes: e.target.value })} /></Field>
          <label className="flex items-center gap-2 text-sm text-white/70">
            <input type="checkbox" checked={form.reminder} onChange={e => setForm({ ...form, reminder: e.target.checked })} className="w-4 h-4 rounded accent-sky-400" />
            Set reminder
          </label>
          <div className="flex gap-3 pt-2">
            <Button type="submit" accent="linear-gradient(135deg,#38BDF8,#0EA5E9)" className="flex-1 justify-center">{editing ? 'Save Changes' : 'Add Meeting'}</Button>
            <Button variant="ghost" onClick={() => setModalOpen(false)} className="flex-1 justify-center">Cancel</Button>
          </div>
        </form>
      </Modal>
    </div>
  );
}

function NotesView({ notes, setNotes }: { notes: Note[]; setNotes: any }) {
  const [modalOpen, setModalOpen] = useState(false);
  const [editing, setEditing] = useState<Note | null>(null);
  const [confirmId, setConfirmId] = useState<ID | null>(null);
  const [search, setSearch] = useState('');
  const empty = { title: '', content: '', tags: '' };
  const [form, setForm] = useState<any>(empty);

  const filtered = notes.filter(n => (n.title + n.content + n.tags.join(' ')).toLowerCase().includes(search.toLowerCase()));
  const sorted = [...filtered].sort((a, b) => (Number(b.pinned) - Number(a.pinned)) || (b.date > a.date ? 1 : -1));

  function openAdd() { setEditing(null); setForm(empty); setModalOpen(true); }
  function openEdit(n: Note) { setEditing(n); setForm({ title: n.title, content: n.content, tags: n.tags.join(', ') }); setModalOpen(true); }
  function save(e: React.FormEvent) {
    e.preventDefault();
    if (!form.title) return;
    const tags = form.tags.split(',').map((t: string) => t.trim()).filter(Boolean);
    if (editing) setNotes((prev: Note[]) => prev.map(n => n.id === editing.id ? { ...n, title: form.title, content: form.content, tags } : n));
    else setNotes((prev: Note[]) => [...prev, { id: uid(), title: form.title, content: form.content, tags, pinned: false, date: todayISO() }]);
    setModalOpen(false);
  }
  function remove(id: ID) { setNotes((prev: Note[]) => prev.filter(n => n.id !== id)); setConfirmId(null); }
  function togglePin(id: ID) { setNotes((prev: Note[]) => prev.map(n => n.id === id ? { ...n, pinned: !n.pinned } : n)); }

  return (
    <div className="view-enter space-y-6">
      <div className="flex flex-wrap items-center justify-between gap-3">
        <div className="flex items-center gap-3">
          <div className="w-11 h-11 rounded-xl flex items-center justify-center bg-violet-400/15 text-violet-400"><Icon name="notes" size={20} /></div>
          <div><h2 className="text-xl font-display font-bold">Notes</h2><p className="text-sm text-white/40">{notes.length} notes</p></div>
        </div>
        <div className="flex items-center gap-2">
          <div className="relative">
            <Icon name="search" size={14} className="absolute left-3 top-1/2 -translate-y-1/2 text-white/30" />
            <input value={search} onChange={e => setSearch(e.target.value)} placeholder="Search notes..." className={inputCls + ' pl-9 w-48'} />
          </div>
          <Button onClick={openAdd} accent="linear-gradient(135deg,#A78BFA,#8B5CF6)"><Icon name="plus" size={16} />New Note</Button>
        </div>
      </div>

      {sorted.length === 0 ? <EmptyState icon="notes" title="No notes yet" sub="Capture ideas, reminders and plans" /> : (
        <div className="masonry">
          {sorted.map(n => (
            <div key={n.id} className="glass rounded-2xl p-4 card-hover">
              <div className="flex items-start justify-between gap-2 mb-2">
                <h4 className="font-display font-semibold text-sm flex-1">{n.title}</h4>
                <button onClick={() => togglePin(n.id)} className={`shrink-0 ${n.pinned ? 'text-violet-400' : 'text-white/25 hover:text-white/50'}`}><Icon name="pin" size={14} /></button>
              </div>
              <p className="text-sm text-white/60 whitespace-pre-wrap">{n.content}</p>
              {n.tags.length ? <div className="flex flex-wrap gap-1.5 mt-3">{n.tags.map(t => <Pill key={t} color="#A78BFA">{t}</Pill>)}</div> : null}
              <div className="flex items-center justify-between mt-3 pt-3 border-t border-white/5">
                <span className="text-xs text-white/30">{formatDate(n.date)}</span>
                {confirmId === n.id ? (
                  <ConfirmBar label="Delete?" onConfirm={() => remove(n.id)} onCancel={() => setConfirmId(null)} />
                ) : (
                  <div className="flex items-center gap-2">
                    <IconButton icon="edit" onClick={() => openEdit(n)} title="Edit" />
                    <IconButton icon="trash" danger onClick={() => setConfirmId(n.id)} title="Delete" />
                  </div>
                )}
              </div>
            </div>
          ))}
        </div>
      )}

      <Modal open={modalOpen} onClose={() => setModalOpen(false)} title={editing ? 'Edit Note' : 'New Note'}>
        <form onSubmit={save} className="space-y-4">
          <Field label="Title"><input required className={inputCls} value={form.title} onChange={e => setForm({ ...form, title: e.target.value })} /></Field>
          <Field label="Content"><textarea className={inputCls} rows={5} value={form.content} onChange={e => setForm({ ...form, content: e.target.value })} /></Field>
          <Field label="Tags (comma separated)"><input className={inputCls} value={form.tags} onChange={e => setForm({ ...form, tags: e.target.value })} placeholder="idea, finance, urgent" /></Field>
          <div className="flex gap-3 pt-2">
            <Button type="submit" accent="linear-gradient(135deg,#A78BFA,#8B5CF6)" className="flex-1 justify-center">{editing ? 'Save Changes' : 'Add Note'}</Button>
            <Button variant="ghost" onClick={() => setModalOpen(false)} className="flex-1 justify-center">Cancel</Button>
          </div>
        </form>
      </Modal>
    </div>
  );
}
