function GoalsView({ goals, setGoals }: { goals: Goal[]; setGoals: any }) {
  const [modalOpen, setModalOpen] = useState(false);
  const [editing, setEditing] = useState<Goal | null>(null);
  const [confirmId, setConfirmId] = useState<ID | null>(null);
  const empty = { title: '', category: GOAL_CATEGORIES[0], targetAmount: '', currentAmount: '0', deadline: '', notes: '' };
  const [form, setForm] = useState<any>(empty);

  function openAdd() { setEditing(null); setForm(empty); setModalOpen(true); }
  function openEdit(g: Goal) { setEditing(g); setForm({ title: g.title, category: g.category, targetAmount: String(g.targetAmount), currentAmount: String(g.currentAmount), deadline: g.deadline, notes: g.notes }); setModalOpen(true); }
  function save(e: React.FormEvent) {
    e.preventDefault();
    const targetAmount = parseFloat(form.targetAmount), currentAmount = parseFloat(form.currentAmount) || 0;
    if (!form.title || !targetAmount) return;
    const payload = { title: form.title, category: form.category, targetAmount, currentAmount, deadline: form.deadline, notes: form.notes };
    if (editing) setGoals((prev: Goal[]) => prev.map(g => g.id === editing.id ? { ...g, ...payload } : g));
    else setGoals((prev: Goal[]) => [...prev, { id: uid(), ...payload }]);
    setModalOpen(false);
  }
  function remove(id: ID) { setGoals((prev: Goal[]) => prev.filter(g => g.id !== id)); setConfirmId(null); }
  function addFunds(id: ID, amt: number) { setGoals((prev: Goal[]) => prev.map(g => g.id === id ? { ...g, currentAmount: Math.max(0, g.currentAmount + amt) } : g)); }

  return (
    <div className="view-enter space-y-6">
      <div className="flex flex-wrap items-center justify-between gap-3">
        <div className="flex items-center gap-3">
          <div className="w-11 h-11 rounded-xl flex items-center justify-center bg-pink-400/15 text-pink-400"><Icon name="target" size={20} /></div>
          <div><h2 className="text-xl font-display font-bold">Goals</h2><p className="text-sm text-white/40">{goals.length} goals tracked</p></div>
        </div>
        <Button onClick={openAdd} accent="linear-gradient(135deg,#F472B6,#EC4899)"><Icon name="plus" size={16} />New Goal</Button>
      </div>

      {goals.length === 0 ? <EmptyState icon="target" title="No goals yet" sub="Set a savings or investment target to track progress" /> : (
        <div className="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-3 gap-4">
          {goals.map(g => {
            const pct = Math.min(100, (g.currentAmount / g.targetAmount) * 100);
            const daysLeft = g.deadline ? Math.ceil((new Date(g.deadline + 'T00:00:00').getTime() - Date.now()) / 86400000) : null;
            return (
              <Card key={g.id}>
                <div className="flex items-start justify-between mb-1">
                  <h4 className="font-display font-semibold">{g.title}</h4>
                  <Pill color="#F472B6">{g.category}</Pill>
                </div>
                {g.deadline ? <div className="text-xs text-white/40 mb-3">{daysLeft! >= 0 ? `${daysLeft} days left` : 'Overdue'} · {formatDate(g.deadline)}</div> : <div className="mb-3"></div>}
                <div className="w-full h-2 rounded-full bg-white/10 overflow-hidden mb-2">
                  <div className="h-full rounded-full" style={{ width: pct + '%', background: 'linear-gradient(90deg,#F472B6,#EC4899)' }}></div>
                </div>
                <div className="flex items-center justify-between text-sm mb-3">
                  <span className="tabular-nums font-semibold">{formatINR(g.currentAmount)}</span>
                  <span className="text-white/40 tabular-nums">of {formatINR(g.targetAmount)}</span>
                </div>
                {g.notes ? <p className="text-xs text-white/40 mb-3">{g.notes}</p> : null}
                <div className="flex items-center gap-2">
                  <button onClick={() => addFunds(g.id, g.targetAmount * 0.1)} className="text-xs px-2.5 py-1.5 rounded-lg bg-pink-400/10 text-pink-300 hover:bg-pink-400/20">+10%</button>
                  <button onClick={() => addFunds(g.id, 1000)} className="text-xs px-2.5 py-1.5 rounded-lg bg-white/5 hover:bg-white/10 text-white/60">+₹1,000</button>
                  <div className="flex-1"></div>
                  <IconButton icon="edit" onClick={() => openEdit(g)} title="Edit" />
                  <IconButton icon="trash" danger onClick={() => setConfirmId(g.id)} title="Delete" />
                </div>
                {confirmId === g.id ? <div className="mt-2"><ConfirmBar label="Delete goal?" onConfirm={() => remove(g.id)} onCancel={() => setConfirmId(null)} /></div> : null}
              </Card>
            );
          })}
        </div>
      )}

      <Modal open={modalOpen} onClose={() => setModalOpen(false)} title={editing ? 'Edit Goal' : 'New Goal'}>
        <form onSubmit={save} className="space-y-4">
          <Field label="Title"><input required className={inputCls} value={form.title} onChange={e => setForm({ ...form, title: e.target.value })} placeholder="Emergency fund, new laptop..." /></Field>
          <Field label="Category">
            <select className={inputCls} value={form.category} onChange={e => setForm({ ...form, category: e.target.value })}>
              {GOAL_CATEGORIES.map(c => <option key={c} value={c}>{c}</option>)}
            </select>
          </Field>
          <div className="grid grid-cols-2 gap-4">
            <Field label="Target Amount (₹)"><input required type="number" step="0.01" className={inputCls} value={form.targetAmount} onChange={e => setForm({ ...form, targetAmount: e.target.value })} /></Field>
            <Field label="Current Amount (₹)"><input type="number" step="0.01" className={inputCls} value={form.currentAmount} onChange={e => setForm({ ...form, currentAmount: e.target.value })} /></Field>
          </div>
          <Field label="Deadline (optional)"><input type="date" className={inputCls} value={form.deadline} onChange={e => setForm({ ...form, deadline: e.target.value })} /></Field>
          <Field label="Notes"><textarea className={inputCls} rows={2} value={form.notes} onChange={e => setForm({ ...form, notes: e.target.value })} /></Field>
          <div className="flex gap-3 pt-2">
            <Button type="submit" accent="linear-gradient(135deg,#F472B6,#EC4899)" className="flex-1 justify-center">{editing ? 'Save Changes' : 'Add Goal'}</Button>
            <Button variant="ghost" onClick={() => setModalOpen(false)} className="flex-1 justify-center">Cancel</Button>
          </div>
        </form>
      </Modal>
    </div>
  );
}

// ============================================================
// ANALYTICS
// ============================================================
function AnalyticsView({ data }: { data: any }) {
  const { expenses, incomes, forexTrades, cryptoHoldings, business } = data;
  const months = lastNMonthKeys(12);
  const incomeByMonth = months.map(m => incomes.filter((i: Income) => monthKey(i.date) === m).reduce((s: number, i: Income) => s + i.amount, 0));
  const expenseByMonth = months.map(m => expenses.filter((e: Expense) => monthKey(e.date) === m).reduce((s: number, e: Expense) => s + e.amount, 0));
  let netCum = 0;
  const netTrend = months.map((_, i) => { netCum += incomeByMonth[i] - expenseByMonth[i]; return netCum; });

  const catTotals: Record<string, number> = {};
  expenses.forEach((e: Expense) => { catTotals[e.category] = (catTotals[e.category] || 0) + e.amount; });

  const businessByType = BUSINESS_TYPES.map(bt => business.filter((b: BusinessEntry) => b.type === bt.key).reduce((s: number, b: BusinessEntry) => s + (b.revenue - b.expense), 0));

  const closed = forexTrades.filter((t: ForexTrade) => t.status === 'Closed' && t.exitPrice != null);
  const wins = closed.filter((t: ForexTrade) => tradePnl(t) > 0).length;
  const losses = closed.length - wins;
  let fCum = 0;
  const forexTrend = [...closed].sort((a: ForexTrade, b: ForexTrade) => (a.date > b.date ? 1 : -1)).map((t: ForexTrade) => { fCum += tradePnl(t); return fCum; });
  const forexLabels = [...closed].sort((a: ForexTrade, b: ForexTrade) => (a.date > b.date ? 1 : -1)).map((t: ForexTrade) => formatDate(t.date));

  const cryptoAlloc = cryptoHoldings.map((h: CryptoHolding) => h.currentPrice * h.quantity);
  const cryptoLabels = cryptoHoldings.map((h: CryptoHolding) => h.symbol || h.coin);

  const trendConfig = {
    type: 'line',
    data: { labels: months.map(monthLabel), datasets: [
      { label: 'Income', data: incomeByMonth, borderColor: '#34D399', backgroundColor: 'rgba(52,211,153,0.1)', tension: 0.35, fill: true, pointRadius: 2 },
      { label: 'Expense', data: expenseByMonth, borderColor: '#FB7185', backgroundColor: 'rgba(251,113,133,0.1)', tension: 0.35, fill: true, pointRadius: 2 },
    ] },
    options: baseChartOptions(),
  };
  const netTrendConfig = {
    type: 'line',
    data: { labels: months.map(monthLabel), datasets: [{ label: 'Cumulative Net', data: netTrend, borderColor: '#38BDF8', backgroundColor: 'rgba(56,189,248,0.12)', fill: true, tension: 0.35, pointRadius: 2 }] },
    options: baseChartOptions(),
  };
  const catConfig = {
    type: 'doughnut',
    data: { labels: Object.keys(catTotals), datasets: [{ data: Object.values(catTotals), backgroundColor: CHART_PALETTE, borderWidth: 0 }] },
    options: { ...baseChartOptions(), cutout: '68%' },
  };
  const bizConfig = {
    type: 'bar',
    data: { labels: BUSINESS_TYPES.map(b => b.label), datasets: [{ label: 'Profit', data: businessByType, backgroundColor: BUSINESS_TYPES.map(b => b.color), borderRadius: 8, maxBarThickness: 40 }] },
    options: baseChartOptions({ plugins: { legend: { display: false } } }),
  };
  const winLossConfig = {
    type: 'doughnut',
    data: { labels: ['Wins', 'Losses'], datasets: [{ data: [wins, losses], backgroundColor: ['#34D399', '#FB7185'], borderWidth: 0 }] },
    options: { ...baseChartOptions(), cutout: '70%' },
  };
  const forexTrendConfig = {
    type: 'line',
    data: { labels: forexLabels, datasets: [{ label: 'Cumulative P&L', data: forexTrend, borderColor: '#818CF8', backgroundColor: 'rgba(129,140,248,0.15)', fill: true, tension: 0.35, pointRadius: 2 }] },
    options: baseChartOptions(),
  };
  const cryptoConfig = {
    type: 'doughnut',
    data: { labels: cryptoLabels, datasets: [{ data: cryptoAlloc, backgroundColor: CHART_PALETTE, borderWidth: 0 }] },
    options: { ...baseChartOptions(), cutout: '68%' },
  };

  return (
    <div className="view-enter space-y-6">
      <div className="flex items-center gap-3">
        <div className="w-11 h-11 rounded-xl flex items-center justify-center bg-emerald-400/15 text-emerald-400"><Icon name="chart" size={20} /></div>
        <div><h2 className="text-xl font-display font-bold">Analytics</h2><p className="text-sm text-white/40">Full picture across every module</p></div>
      </div>

      <div className="grid grid-cols-1 xl:grid-cols-2 gap-6">
        <Card><h3 className="font-display font-semibold mb-4">Income vs Expenses (12mo)</h3><ChartCanvas config={trendConfig} /></Card>
        <Card><h3 className="font-display font-semibold mb-4">Cumulative Net Cash Flow</h3><ChartCanvas config={netTrendConfig} /></Card>
      </div>
      <div className="grid grid-cols-1 xl:grid-cols-3 gap-6">
        <Card><h3 className="font-display font-semibold mb-4">Expense Categories</h3>{Object.keys(catTotals).length ? <ChartCanvas config={catConfig} height={230} /> : <EmptyState icon="wallet" title="No data" sub="Add expenses to populate" />}</Card>
        <Card><h3 className="font-display font-semibold mb-4">Business Profit by Line</h3><ChartCanvas config={bizConfig} height={230} /></Card>
        <Card><h3 className="font-display font-semibold mb-4">Crypto Allocation</h3>{cryptoAlloc.length ? <ChartCanvas config={cryptoConfig} height={230} /> : <EmptyState icon="coin" title="No holdings" sub="Add crypto to populate" />}</Card>
      </div>
      <div className="grid grid-cols-1 xl:grid-cols-3 gap-6">
        <Card className="xl:col-span-2"><h3 className="font-display font-semibold mb-4">Forex Cumulative P&L</h3>{closed.length ? <ChartCanvas config={forexTrendConfig} /> : <EmptyState icon="activity" title="No closed trades" sub="Close trades to populate" />}</Card>
        <Card><h3 className="font-display font-semibold mb-4">Forex Win / Loss</h3>{closed.length ? <ChartCanvas config={winLossConfig} height={220} /> : <EmptyState icon="target" title="No data" sub="Close trades to populate" />}</Card>
      </div>
    </div>
  );
}

// ============================================================
// APP SHELL
// ============================================================
function Sidebar({ view, setView, mobileOpen, setMobileOpen }: any) {
  return (
    <>
      {mobileOpen ? <div className="fixed inset-0 bg-black/60 z-30 lg:hidden" onClick={() => setMobileOpen(false)}></div> : null}
      <aside className={`fixed lg:sticky top-0 h-screen w-64 shrink-0 glass-strong border-r border-white/5 z-40 transition-transform duration-300 lg:translate-x-0 ${mobileOpen ? 'translate-x-0' : '-translate-x-full'} flex flex-col`}>
        <div className="flex items-center gap-3 px-5 py-6" style={{ paddingTop: 'calc(var(--safe-top) + 1.5rem)' }}>
          <div className="w-10 h-10 rounded-xl overflow-hidden shrink-0">
            <img src="./icons/tmr-logo.png" alt="TMR" className="w-full h-full object-cover" />
          </div>
          <div>
            <div className="font-display font-bold leading-tight">TMR</div>
            <div className="text-[11px] text-white/40 leading-tight">Expense Tracker</div>
          </div>
        </div>
        <nav className="flex-1 overflow-y-auto scrollbar-thin px-3 space-y-1">
          {MODULES.map(m => (
            <button key={m.key} data-active={view === m.key} onClick={() => { setView(m.key); setMobileOpen(false); }}
              className="nav-item w-full flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-medium text-white/60 hover:text-white">
              <span className="w-1 h-5 rounded-full nav-dot" style={{ background: m.color }}></span>
              <span className="w-8 h-8 rounded-lg flex items-center justify-center" style={{ background: view === m.key ? m.color + '22' : 'transparent', color: view === m.key ? m.color : undefined }}>
                <Icon name={m.icon} size={16} />
              </span>
              <span className={view === m.key ? 'text-white' : ''}>{m.label}</span>
            </button>
          ))}
        </nav>
        <div className="p-4 mx-3 rounded-xl bg-white/5 border border-white/5" style={{ marginBottom: 'calc(var(--safe-bottom) + 1rem)' }}>
          <div className="text-xs text-white/40 leading-relaxed">All data stays on this device via LocalStorage. No accounts, no cloud.</div>
        </div>
      </aside>
    </>
  );
}

function TopBar({ view, onMenu, theme, onToggleTheme }: { view: string; onMenu: () => void; theme: 'dark' | 'light'; onToggleTheme: () => void }) {
  const meta = MODULES.find(m => m.key === view)!;
  const [now] = useState(new Date());
  return (
    <header className="sticky top-0 z-20 glass border-b border-white/5 px-4 sm:px-6 py-4 flex items-center justify-between"
      style={{ paddingTop: 'calc(var(--safe-top) + 1rem)' }}>
      <div className="flex items-center gap-3">
        <button onClick={onMenu} className="lg:hidden w-9 h-9 rounded-lg bg-white/5 flex items-center justify-center">
          <Icon name="filter" size={16} />
        </button>
        <div>
          <h1 className="font-display font-bold text-lg leading-tight">{meta.label}</h1>
          <p className="text-xs text-white/40">{now.toLocaleDateString('en-IN', { weekday: 'long', day: '2-digit', month: 'long', year: 'numeric' })}</p>
        </div>
      </div>
      <div className="flex items-center gap-3">
        <div className="hidden sm:flex items-center gap-2 pulse rounded-full">
          <span className="w-2 h-2 rounded-full bg-emerald-400"></span>
          <span className="text-xs text-white/50">Synced locally</span>
        </div>
        <ThemeToggle theme={theme} onToggle={onToggleTheme} />
      </div>
    </header>
  );
}

function App() {
  const [view, setView] = useState('dashboard');
  const [mobileOpen, setMobileOpen] = useState(false);
  const [theme, setTheme] = useLocalStorageState<'dark' | 'light'>('theme', 'dark');
  CURRENT_THEME = theme;
  useEffect(() => { document.documentElement.setAttribute('data-theme', theme); }, [theme]);
  const toggleTheme = useCallback(() => setTheme(t => t === 'dark' ? 'light' : 'dark'), [setTheme]);

  const [expenses, setExpenses] = useLocalStorageState<Expense[]>('expenses', []);
  const [incomes, setIncomes] = useLocalStorageState<Income[]>('incomes', []);
  const [forexTrades, setForexTrades] = useLocalStorageState<ForexTrade[]>('forexTrades', []);
  const [cryptoHoldings, setCryptoHoldings] = useLocalStorageState<CryptoHolding[]>('cryptoHoldings', []);
  const [business, setBusiness] = useLocalStorageState<BusinessEntry[]>('business', []);
  const [meetings, setMeetings] = useLocalStorageState<Meeting[]>('meetings', []);
  const [notes, setNotes] = useLocalStorageState<Note[]>('notes', []);
  const [goals, setGoals] = useLocalStorageState<Goal[]>('goals', []);

  const data = { expenses, incomes, forexTrades, cryptoHoldings, business, meetings, notes, goals };

  return (
    <div className="flex min-h-screen">
      <Sidebar view={view} setView={setView} mobileOpen={mobileOpen} setMobileOpen={setMobileOpen} />
      <div className="flex-1 min-w-0">
        <TopBar view={view} onMenu={() => setMobileOpen(true)} theme={theme} onToggleTheme={toggleTheme} />
        <main className="p-4 sm:p-6 max-w-[1600px] mx-auto" style={{ paddingBottom: 'calc(var(--safe-bottom) + 1.5rem)' }}>
          {view === 'dashboard' && <DashboardView data={data} />}
          {view === 'expenses' && <TransactionView title="Expense Tracker" accent="#FB7185" icon="wallet" items={expenses} setItems={setExpenses} categories={EXPENSE_CATEGORIES} kind="Expense" />}
          {view === 'income' && <TransactionView title="Income Tracker" accent="#34D399" icon="trendingUp" items={incomes} setItems={setIncomes} categories={INCOME_CATEGORIES} kind="Income" />}
          {view === 'forex' && <ForexView trades={forexTrades} setTrades={setForexTrades} />}
          {view === 'crypto' && <CryptoView holdings={cryptoHoldings} setHoldings={setCryptoHoldings} />}
          {view === 'business' && <BusinessView business={business} setBusiness={setBusiness} />}
          {view === 'scheduler' && <SchedulerView meetings={meetings} setMeetings={setMeetings} />}
          {view === 'notes' && <NotesView notes={notes} setNotes={setNotes} />}
          {view === 'goals' && <GoalsView goals={goals} setGoals={setGoals} />}
          {view === 'analytics' && <AnalyticsView data={data} />}
        </main>
      </div>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
